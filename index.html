  <script>
    (function() {
      const theme = localStorage.getItem('color-mode');
      const prefersDark = theme === null 
        ? window.matchMedia('(prefers-color-scheme: dark)').matches 
        : theme === 'dark';
      
      if (prefersDark) {
        document.documentElement.classList.add('dark-mode');
      }
    })();
  </script>
